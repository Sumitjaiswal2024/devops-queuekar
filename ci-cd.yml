name: Queueker CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:        # lets you run it manually from the Actions tab

jobs:
  # ---------- CI: Backend ----------
  backend-test:
    name: Backend - install and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Queueker-Backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Queueker-Backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          MONGOMS_DISABLE_POSTINSTALL: '1'   # skip the large MongoDB binary download; tests don't need it

      - name: Run unit tests
        run: npm test

  # ---------- CI: Frontend ----------
  frontend-build:
    name: Frontend - lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Queueker-React
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Queueker-React/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (report only)
        run: npm run lint
        continue-on-error: true      # existing code has lint errors; shown as a warning, does not fail the pipeline

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_URL: https://queueker-backend.onrender.com

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Queueker-React/dist

  # ---------- CD: Deploy ----------
  deploy:
    name: Deploy to Render
    needs: [backend-test, frontend-build]          # only runs if BOTH CI jobs pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RENDER_BACKEND_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
      RENDER_FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
    steps:
      - name: Deploy backend
        if: env.RENDER_BACKEND_HOOK != ''
        run: curl -fsS -X POST "$RENDER_BACKEND_HOOK"

      - name: Deploy frontend
        if: env.RENDER_FRONTEND_HOOK != ''
        run: curl -fsS -X POST "$RENDER_FRONTEND_HOOK"

      - name: No deploy hooks configured
        if: env.RENDER_BACKEND_HOOK == '' && env.RENDER_FRONTEND_HOOK == ''
        run: echo "Deploy hooks not set. Add RENDER_BACKEND_DEPLOY_HOOK / RENDER_FRONTEND_DEPLOY_HOOK secrets to enable deployment."
